[project]
name = "meteoswiss-retriever"
description = "Python data retriever from MeteoSwiss open-data APIs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.43.2",
    "pytz>=2026.3.post1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "types-pytz>=2026.3.1.20260727",
]

[[tool.mypy.overrides]]
module = ["meteoswiss_retriever.*"]
ignore_missing_imports = true
