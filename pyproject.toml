[project]
name = "meteoswiss"
description = "Python data retriever from MeteoSwiss open-data APIs"
version = "1.2.0"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "platformdirs>=4.11.0",
    "polars>=1.43.2",
    "pytz>=2026.3.post1",
    "shapely>=2.1.2",
]

readme = "README.md"
license-files = ["LICEN[CS]E*"]

authors = [
    {name = "Lucas RODRIGUEZ"}
]
maintainers = [
    {name = "Lucas RODRIGUEZ"}
]

# PyPi classifiers
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

keywords = ["weather", "weather-data", "weather-api", "forecasts", "measurements", "weather-alerts"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "types-pytz>=2026.3.1.20260727",
]

[[tool.mypy.overrides]]
module = ["meteoswiss.*"]
ignore_missing_imports = true

[tool.uv]
package = true
exclude-newer = "2 days"  # https://docs.astral.sh/uv/reference/settings/#exclude-newer


[project.urls]
Homepage = "https://github.com/lcsrodriguez/meteoswiss-retriever"
Repository = "https://github.com/lcsrodriguez/meteoswiss-retriever"
"Bug Tracker" = "https://github.com/lcsrodriguez/meteoswiss-retriever/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteoswiss"]

# PyPi index (TEST)
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# PyPi index (PROD)
[[tool.uv.index]]
name = "pypi" # PROD
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
